# fly.toml — host journal-mcp on Fly.io Machines (single machine + volume,
# single-writer model preserved: every device talks to this one daemon).
#
# One-shot deploy (idempotent, includes app/volume/secret setup + smoke):
#   JOURNAL_FLY_APP=<your-app-name> bash contrib/fly/deploy.sh
#
# Manual equivalent (from the repo root — the Dockerfile is auto-detected):
#   fly apps create <your-app-name>
#   fly volumes create journal_data --app <your-app-name> --region nrt --size 1
#   fly secrets set --app <your-app-name> JOURNAL_MCP_HTTP_TOKEN=<token>
#   fly deploy --config contrib/fly/fly.toml --app <your-app-name>
#
# Full walkthrough: docs/runbooks/fly-io-deploy.md
#
# Non-loopback bind refuses to start without JOURNAL_MCP_HTTP_TOKEN; every
# request must carry `Authorization: Bearer <token>`. TLS terminates at the
# Fly edge, so the container speaks plain HTTP.
#
# Multi-project layout: JOURNAL_PROJECT_ROOT is the default project; clients
# address other projects by passing a per-call `project_root` under /data
# (e.g. "/data/journal/<repo-name>") — one daemon, N EventLogs.
#
# `app` is a placeholder — deploy.sh overrides it via --app, or replace it
# with your own app name for plain `fly deploy`.
app = "your-journal-app"
primary_region = "nrt"

[processes]
  app = "--mcp-http --bind 0.0.0.0:8487"

[env]
  # EventLog SQLite ({root}/workspace/.journal.db) + project-local schemas
  # ({root}/.journal/schemas) live on the mounted volume.
  JOURNAL_PROJECT_ROOT = "/data/journal/default"

[[mounts]]
  source = "journal_data"
  destination = "/data"

[http_service]
  processes = ["app"]
  internal_port = 8487
  force_https = true
  # A stateful daemon should not scale to zero or fan out: exactly one
  # machine may own the volume / SQLite files.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
